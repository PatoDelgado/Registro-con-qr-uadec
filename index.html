<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAdeC - Registro de Visitas</title>
  <!-- Mantén tus estilos FontAwesome y fuentes aquí -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
  <!-- QRious Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="./config.js"></script>
</head>
<body>

  <!-- Cabecera Institucional -->
  <header class="site-header">
    <div class="site-header__brand">
      <img class="site-header__logo" src="./uadec-logo.png" alt="UAdeC">
      <div class="site-header__copy">
        <span>Universidad Autónoma de Coahuila</span>
        <strong>Registro de Visitas Industriales</strong>
      </div>
    </div>
    <div class="site-header__badge">
      <span>Portal UAdeC</span>
      <a class="badge-link" href="./admin.html">Admin</a>
    </div>
  </header>

  <main class="container">
    <!-- Formulario de Registro -->
    <section class="card form-section">
      <div class="hero-copy hero-copy--compact">
        <span class="eyebrow">En el bien fincamos el saber</span>
        <h1>Registro para visitas industriales</h1>
        <p>Genera tu pase de acceso con identidad UAdeC y código QR único.</p>
      </div>
      <form id="registroForm">
        <div class="form-group">
          <label for="nombre"><i class="fa-solid fa-user"></i> Nombre Completo</label>
          <input type="text" id="nombre" required placeholder="Ej. Patricio Delgado">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="matricula"><i class="fa-solid fa-id-card"></i> Matrícula</label>
            <input type="text" id="matricula" required placeholder="Ej. 23124567">
          </div>
          <div class="form-group">
            <label for="facultad"><i class="fa-solid fa-school"></i> Facultad</label>
            <input type="text" id="facultad" required placeholder="Ej. Facultad de Sistemas">
          </div>
        </div>

        <div class="form-group">
          <label for="carrera"><i class="fa-solid fa-graduation-cap"></i> Carrera</label>
          <input type="text" id="carrera" required placeholder="Ej. Ing. en Sistemas Computacionales">
        </div>

        <!-- REEMPLAZO DINÁMICO: Selector de Visitas -->
        <div class="form-group">
          <label for="id_visita"><i class="fa-solid fa-industry"></i> Selecciona la Visita Industrial</label>
          <select id="id_visita" required>
            <option value="">Cargando visitas disponibles...</option>
          </select>
          <div id="cupos-indicador" class="cupos-banner" style="display: none;">
            <!-- Mostrará los cupos de manera dinámica -->
          </div>
        </div>

        <button type="submit" id="btnGenerar" class="btn btn--primary">
          <i class="fa-solid fa-qrcode"></i> Generar Pase Digital
        </button>
      </form>
      <div id="mensajeFeedback" class="message" style="display: none;"></div>
    </section>

    <!-- Previsualizador de Pase QR -->
    <section class="card preview-section">
      <h3>Tu Pase de Acceso</h3>
      <div id="preview" class="qr-preview empty">
        <div id="qrMount">
          <i class="fa-solid fa-qrcode-slash placeholder-icon"></i>
          <p>Llena los datos para generar tu código QR de acceso</p>
        </div>
      </div>
      <div class="action-buttons">
        <button id="btnDescargar" class="btn" disabled><i class="fa-solid fa-download"></i> Descargar</button>
        <button id="btnImprimir" class="btn" disabled><i class="fa-solid fa-print"></i> Imprimir</button>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
